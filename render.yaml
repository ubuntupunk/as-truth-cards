# Canonical production deployment.
#
# Render hosts this repository in production. There is no Vercel configuration and no
# `vercel.json`; the app is a long-running Express process serving both the API and the
# built Vite bundle, which does not fit a static/edge deployment model.
#
# Deploy path, in order:
#   build  pnpm install -> prisma generate (postinstall) -> vite build -> dist/
#   pre-deploy  prisma migrate deploy, then the trope_graph Drizzle migrations, then the
#               trope_graph seed
#   start  tsx server/index.ts, which serves dist/ and /api/* on $PORT
#
# All three pre-deploy steps are required. Omitting the migrations deploys a process that boots
# and then fails on first request, because neither the Prisma `public` schema nor the Drizzle
# `trope_graph` schema is created automatically. Omitting the seed deploys a healthy process
# whose graph tables exist but are empty.
#
# ONE-TIME PRODUCTION ADOPTION REQUIRED. The `public` schema on Neon was created before the
# Prisma migration ledger existed: `cards`, `user_profiles` and `user_interactions` are present
# with data, the three enums exist, and `public._prisma_migrations` does not. `prisma migrate
# deploy` therefore replays `20251021000000_baseline_existing_schema`, whose bare `CREATE TYPE` /
# `CREATE TABLE` statements collide with what is already there, and fails with P3018 /
# SQLSTATE 42710 `type "UserRole" already exists`. That aborts pre-deploy before the graph
# migrations run, which is why `trope_graph` has never existed in production.
#
# Resolve it once, by hand, before the next deploy:
#
#   pnpm exec prisma migrate resolve --applied 20251021000000_baseline_existing_schema
#   pnpm run db:migrate:deploy
#   pnpm run trope-graph:migrate -- --allow-remote
#   pnpm run trope-graph:seed
#
# `resolve --applied` records the baseline without executing it, which is accurate here: the
# existing `cards` table matches the baseline column for column. The subsequent deploy then
# applies only `20260930210000_better_auth_users`, whose leading `DROP TABLE "user_profiles"`
# discards 0 rows. After that every deploy is a no-op until the corpus changes.
#
# Secrets are entered in the Render dashboard and are not stored here.

services:
  - type: web
    name: as-truth-cards
    runtime: node
    # `free` is deliberate and current, not an oversight. It is what the live service
    # (srv-d7372tfkijhs73dbihjg) actually runs on, and this file is kept in agreement with
    # reality so that applying it never silently changes billing. Its cost is that Render
    # will not run `preDeployCommand` -- see the long note on that line below.
    #
    # Upgrading to `starter` is the one-line change that re-enables automatic migrations.
    plan: free
    region: ohio

    # pnpm, because the repository is locked with pnpm-lock.yaml. `npm install` ignores
    # that lockfile and resolves different versions from the registry.
    #
    # `&&`, not `;`. With `;` the build runs even when the install fails, so a broken
    # lockfile produces a bundle assembled from a half-installed node_modules instead of a
    # clean failure.
    #
    # No `corepack enable`. Render's image already provides pnpm on PATH, and corepack tries
    # to unlink `/usr/bin/pnpm` to install its own shim, which fails with
    # `EROFS: read-only file system` and breaks the build outright. Verified on the live
    # service: adding corepack failed every deploy; removing it built cleanly.
    buildCommand: pnpm install --frozen-lockfile && pnpm run build

    # This is where migrations belong: before the new version goes live, not at build time,
    # so a failed migration aborts the deploy instead of shipping a process against a stale
    # schema. Read the free-plan note below before trusting any of it.
    #
    # `trope-graph:seed` is not optional. Migrate creates the 39 `trope_graph` tables and stops;
    # without a seed the schema is empty and every graph endpoint reports itself data_blocked.
    # The corpus is authored in this repository and reaches production only through this step, so
    # a deploy that omits it ships the previous corpus no matter what the commit contains. The
    # seeder is idempotent (it upserts by slug/id and `trope-graph:verify` asserts
    # `"idempotent": true`), so re-running it on every deploy is what keeps production current.
    #
    # `--allow-remote` is required because DATABASE_URL is a Neon endpoint, not loopback.
    # The seeder has no flag of its own -- it reads TROPE_GRAPH_ALLOW_REMOTE from the
    # environment -- so that variable below is what lets this step reach production.
    #
    # INERT ON THE `free` PLAN. Render does not run pre-deploy commands on free instances. It
    # logs `Predeploy command not run. Commands can only run on paid instance types` and then
    # promotes the build anyway, reporting success. A green deploy on `free` therefore proves
    # only that the build and the process start worked -- it says nothing about the schema.
    #
    # Until the plan is upgraded, run this by hand before trusting a deploy. See
    # README.md ("Deploying") for the full runbook:
    #
    #   pnpm run db:migrate:deploy
    #   pnpm run trope-graph:migrate -- --allow-remote
    #   TROPE_GRAPH_ALLOW_REMOTE=1 pnpm run trope-graph:seed
    #
    # Run it whenever a commit touches `prisma/migrations/`, `trope-cards/src/db/migrations/`
    # or anything the seeder reads (`trope-cards/src/db/seed/`). Seeding is idempotent, so
    # re-running all three is always safe and is how corpus changes reach production.
    preDeployCommand: pnpm run db:migrate:deploy && pnpm run trope-graph:migrate -- --allow-remote && pnpm run trope-graph:seed

    # `tsx` executes server/index.ts directly; there is no server-side compile step.
    # It is a devDependency, so `pnpm install` must not be run with --prod. Render
    # installs devDependencies by default and `NODE_ENV` alone does not omit them.
    startCommand: pnpm run start

    healthCheckPath: /health

    autoDeployTrigger: commit

    envVars:
      # Express takes the static-bundle path only when this is exactly "production".
      - key: NODE_ENV
        value: production

      # Neon Postgres connection string. Serves the Prisma `public` schema *and* the
      # Drizzle `trope_graph` schema, which is safe because they are separate schemas in
      # one database and cannot collide. To host the graph in a separate database instead,
      # add TROPE_GRAPH_DATABASE_URL below and give it a real value -- do not set it to an
      # empty string, which is not treated as unset.
      - key: DATABASE_URL
        sync: false

      # Opts the graph migrate/verify/seed tooling in to a non-loopback host. Without it
      # `trope-graph:seed` aborts with `Refusing to touch non-local database host` and the
      # pre-deploy chain fails after the Prisma migration has already run. The repository
      # `.env` points DATABASE_URL at live Neon and the graph client falls back to it, so
      # this is what keeps an unset TROPE_GRAPH_DATABASE_URL from being a footgun.
      #
      # `trope-graph:migrate` also accepts `--allow-remote` on the command line, but the
      # seeder and the verifier only read this variable.
      - key: TROPE_GRAPH_ALLOW_REMOTE
        value: "1"

      # Better Auth signs and encrypts session cookies with this.
      #
      # Required, and not self-evident from a failed deploy: if it is unset the process
      # still boots and auth still answers, but Better Auth falls back to a hardcoded
      # default secret that is published in its own source. Session cookies signed with a
      # known key can be forged, including sessions carrying a privileged role.
      #
      # Render generates a 256-bit value once; later blueprint syncs leave it alone.
      # Rotating it invalidates every existing session.
      - key: BETTER_AUTH_SECRET
        generateValue: true

      # The public origin the browser uses, e.g. https://as-truth-cards.onrender.com.
      # Better Auth validates the Origin header against it; production is same-origin, so
      # this must be the deployed URL and not a localhost value.
      - key: BETTER_AUTH_URL
        sync: false
